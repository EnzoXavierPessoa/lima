<head>

    <meta name="viewport" conetent="widht=device-widht-widht, initial-scale=1.0">
    <tiltle>Display Flex</tiltle>
    <style>
        .container{
            display: flex;
            flex-flow: row wrap;
            justify-content: space-evenly;
            align-items: center;
            align-content: flex-start;
            background-color: dodgerblue;
            height: 400px
        }
        .container div{
            background-color: #f1f1f1;
            width: 100px; 
            margin: 10px;
            padding: 10px;
            text-align: center;
            font-size: 30px;
        }
    </style>
</head>
<body>
    <h1>Flex</h1>
    <p>Para usar o flex é necessario haver um elemento ancestral com a estilização display: flex</p>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
        
    </div>
</body>
</html>
