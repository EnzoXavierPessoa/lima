<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <h1>Formulario de Cadastro</h1>
    <form action="" method="POST">
        <label for="nome">Nome:</label>
        <input type="text"
               id="nome" 
               name="nome" 
               required
               min-lenght="2"
               max-lenght="50"
               placeholder="Digite seu nome"
            >
            <br><br>
            <label for="telefone">Telefone:</label>
            <input
                type="tel"
                id="telefone"
                name="telefone"
                required
                placeholder="(XX) XXXXX-XXXX"
            <br><br>
            <label for="email">E-mail:</label>
            <input
                type="tel"
                id="telefone"
                name="telefone"
                required
                placeholder="(XX) XXXXX-XXXX"
                pattern="\(\d{2}\) \d{4,5}-\d{4}"

            <br><br> 
            <label for ="idade"> Idade:</label>
            <unput
                type="number"
                id="idade"
                name="idade"
                required
                min="18"
                max="120"
                step="1"
            >
            <br><br>
            <label for="data-nascimento">Data de Nascimento:</label>
            <input
                type="date"
                id="data de nascimento"
                name="data de nascimento"
                required
                min=" 1900-01 01"
                max="2026-07-24"


            <br><br>
            <label for="website">Pagina Pessoal:</label>
            <input for="comentarios">Comentarios:</label>
            <textarea
                id="comentarios"
                name="comentarios"
                rows="4"
                cols="50"
                maxlenght="500"
                placeholder="Deixe seu comentario aqui"
                ></textarea>
            <br><br>

            <button type="submit">Cadastrar</button>

            input, select, tectearea{
                
            }
 
        </form>
</body>
</html>
